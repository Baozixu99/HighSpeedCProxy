; Bluetooth device (dev_id=101)
[device_101]
dev_id = 101
dev_type = bluetooth  ; Enumeration values: bluetooth/can/zigbee/lora/powerlink
ns_name = iot_bluetooth
dev_status = online
name = ble_sensor_01
working_mode = client  ; 0=client mode, 1=server/gateway mode
config_path = /etc/iot/dev_101.conf
auto_connect = 1       ; 0=manual connect, 1=auto connect on startup
physical_port = 0
; Bluetooth specific parameters
bt_port = 18
bt_version = 5.0
conn_interval = 50     ; BLE connection interval (ms)
bt_mac = 00:12:34:56:78:9A

; CAN device (dev_id=102)
[device_102]
dev_id = 102
dev_type = can
ns_name = iot_can
dev_status = online
name = can_bus_01
working_mode = gateway
config_path = /etc/iot/dev_102.conf
auto_connect = 1
physical_port = 1
; CAN specific parameters
can_port = 0
can_bitrate = 500000   ; CAN bus bitrate (bps)
can_mode = normal      ; normal/loopback/silent
can_filter_id = 0x12345678

; Zigbee device (dev_id=103)
[device_103]
dev_id = 103
dev_type = zigbee
ns_name = iot_zigbee
dev_status = online
name = zigbee_coordinator_01
working_mode = gateway
config_path = /etc/iot/dev_103.conf
auto_connect = 1
physical_port = 2
; Zigbee specific parameters
zigbee_pan_id = 0x1234
zigbee_channel = 18    ; Zigbee channel (11-26)
zigbee_role = coordinator  ; coordinator/router/enddevice
zigbee_mac = 00:12:34:56:78:9A:BC:DE

; LoRa device (dev_id=104)
[device_104]
dev_id = 104
dev_type = lora
ns_name = iot_lora
dev_status = online
name = lora_endnode_01
working_mode = client
config_path = /etc/iot/dev_104.conf
auto_connect = 1
physical_port = 3
; LoRa specific parameters
lora_port = 2
lora_freq_band = EU868 ; EU868/US915/CN470
lora_sf = 9            ; LoRa spreading factor (7-12)
lora_cr = 1            ; LoRa coding rate (1-4, 4/5 ~ 4/8)
lora_dev_eui = 0011223344556677


; OpenPowerLink device (dev_id=105)
[device_105]
dev_id = 105
dev_type = powerlink  ; Enumeration values: bluetooth/can/zigbee/lora/powerlink
ns_name = iot_powerlink
dev_status = online
name = powerlink_mn_01
working_mode = gateway  ; 0=client mode, 1=server/gateway mode
config_path = /etc/iot/dev_105.conf
auto_connect = 1       ; 0=manual connect, 1=auto connect on startup
physical_port = 4
; OpenPowerLink specific parameters
plk_port = 0           ; POWERLINK port number (Ethernet interface)
plk_node_id = 1        ; POWERLINK NodeID (1-240)
plk_role = mn          ; mn (Managing Node)/cn (Controlled Node)
plk_cycle_ms = 1       ; Real-time cycle (ms, 1~10ms)
plk_rx_pdo_len = 64    ; Received PDO length
plk_tx_pdo_len = 64    ; Transmitted PDO length
plk_mac = 00:12:34:56:78:9B ; POWERLINK device MAC address


; ModbusTCP device (dev_id=106)
[device_106]
dev_id = 106
dev_type = modbustcp      ; New type supported
ns_name = iot_modbus
dev_status = online
name = modbus_tcp_slave_01
working_mode = client     ; Typically client when connecting to a PLC/Server
config_path = /etc/iot/dev_106.conf
auto_connect = 1
physical_port = 5         ; Logical port mapping if needed

; ModbusTCP specific parameters
mb_port = 502             ; Standard ModbusTCP port
mb_unit_id = 1            ; Slave ID (1-247 usually, 0 is broadcast)
mb_proto_ver = tcp        ; 'tcp' for standard ModbusTCP, 'rtu_over_tcp' for RTU framing
mb_timeout_ms = 1000      ; Connection/Response timeout in ms
mb_retry_cnt = 3          ; Number of retries on failure
mb_mac = 00:12:34:56:78:9C ; Device MAC address
